<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordQuest 180 — เกมฝึกคำศัพท์อังกฤษ</title>
<style>
  :root{
    --bg:#0b1020; --txt:#e8ecff; --muted:#94a0c8;
    --line:rgba(255,255,255,.12);
    --accent:#6c8cff; --accent2:#22d3a6;
    --danger:#ff6b81; --warn:#ffc857;
    --special:#f0a500;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Noto Sans Thai","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;
    display:flex; justify-content:center; padding:16px;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1;
    background:
      radial-gradient(700px 500px at 15% 0%, rgba(108,140,255,.22), transparent 60%),
      radial-gradient(600px 500px at 90% 20%, rgba(34,211,166,.16), transparent 60%),
      radial-gradient(600px 500px at 50% 110%, rgba(255,107,129,.12), transparent 60%);
  }
  .app{width:100%;max-width:760px;display:flex;flex-direction:column;gap:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{font-weight:800;font-size:1.05rem;letter-spacing:.5px}
  .header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .stats{display:flex;gap:8px;font-size:.8rem;flex-wrap:wrap}
  .chip{
    background:rgba(255,255,255,.06);border:1px solid var(--line);
    padding:5px 10px;border-radius:999px;white-space:nowrap
  }
  .chip b{color:var(--accent2)}
  .sound-toggle{
    background:rgba(255,255,255,.08);border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;font-size:1rem;cursor:pointer;
    font-family:inherit;color:var(--txt);transition:.15s;line-height:1
  }
  .sound-toggle:hover{background:rgba(108,140,255,.25)}
  .sound-toggle.off{
    background:rgba(255,107,129,.15);border-color:rgba(255,107,129,.4)
  }
  main{flex:1}

  .hero{text-align:center;padding:18px 0 6px}
  .badge{
    display:inline-block;font-size:.72rem;color:var(--muted);
    border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:12px
  }
  .hero h1{
    font-size:2.4rem;letter-spacing:-1px;line-height:1.1;
    background:linear-gradient(90deg,#8fa8ff,#22d3a6);
    -webkit-background-clip:text;background-clip:text;color:transparent
  }
  .sub{color:var(--muted);font-size:.9rem;margin-top:10px;line-height:1.6}

  .levels{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .level-card{
    display:flex;align-items:center;gap:14px;text-align:left;
    padding:18px 20px;border-radius:20px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid var(--line);color:var(--txt);
    font-family:inherit;transition:.18s transform,.18s border-color,.18s background;
    width:100%
  }
  .level-card:hover:not(.locked){
    transform:translateY(-3px);border-color:rgba(108,140,255,.6);
    background:linear-gradient(160deg,rgba(108,140,255,.22),rgba(255,255,255,.03))
  }
  .level-card.special{
    background:linear-gradient(160deg,rgba(240,165,0,.18),rgba(255,255,255,.03));
    border-color:rgba(240,165,0,.45)
  }
  .level-card.special:hover{
    border-color:var(--special);
    background:linear-gradient(160deg,rgba(240,165,0,.3),rgba(255,255,255,.03))
  }
  .level-card.locked{
    opacity:.45;cursor:not-allowed;
    background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(255,255,255,.01))
  }
  .level-num{
    flex-shrink:0;width:52px;height:52px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;font-weight:900;
    background:linear-gradient(135deg,var(--accent),#8b6cff);
    color:#fff
  }
  .level-card.special .level-num{
    background:linear-gradient(135deg,#f0a500,#ff6b81)
  }
  .level-card.locked .level-num{
    background:rgba(255,255,255,.08);color:var(--muted)
  }
  .level-info{flex:1;min-width:0}
  .level-title{font-weight:700;font-size:1rem;margin-bottom:3px}
  .level-desc{font-size:.78rem;color:var(--muted);line-height:1.5}
  .level-badge{
    font-size:.7rem;padding:4px 10px;border-radius:999px;font-weight:700;
    background:rgba(34,211,166,.18);color:var(--accent2);white-space:nowrap
  }
  .level-card.special .level-badge{
    background:rgba(240,165,0,.22);color:var(--warn)
  }
  .level-badge.locked-badge{
    background:rgba(255,255,255,.06);color:var(--muted)
  }

  .level-header{
    display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:18px;
    background:linear-gradient(135deg,rgba(108,140,255,.2),rgba(34,211,166,.1));
    border:1px solid var(--line);margin-bottom:6px
  }
  .level-header.special{
    background:linear-gradient(135deg,rgba(240,165,0,.25),rgba(255,107,129,.12));
    border-color:rgba(240,165,0,.4)
  }
  .level-header .ln{font-size:1.5rem;font-weight:900;color:var(--accent2)}
  .level-header.special .ln{color:var(--warn)}
  .level-header .lt{font-size:.85rem;color:var(--muted);line-height:1.5}
  .level-header .lt b{color:var(--txt)}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(max-width:520px){.modes{grid-template-columns:1fr}}
  .mode-card{
    display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;
    padding:16px 18px;border-radius:18px;cursor:pointer;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
    border:1px solid var(--line);color:var(--txt);
    font-family:inherit;transition:.18s transform,.18s border-color,.18s background
  }
  .mode-card:hover{transform:translateY(-3px);border-color:rgba(108,140,255,.6);
    background:linear-gradient(160deg,rgba(108,140,255,.22),rgba(255,255,255,.03))}
  .mode-card .emoji{font-size:1.5rem}
  .mode-card .m-title{font-weight:700;font-size:1rem}
  .mode-card .m-desc{font-size:.78rem;color:var(--muted);line-height:1.5}

  .primary,.ghost,.icon-btn{
    font-family:inherit;cursor:pointer;border-radius:14px;font-size:.92rem;
    padding:12px 20px;border:1px solid transparent;transition:.15s;font-weight:600
  }
  .primary{background:linear-gradient(135deg,var(--accent),#8b6cff);color:#fff;
    box-shadow:0 8px 22px -10px var(--accent)}
  .primary:hover{filter:brightness(1.12)}
  .ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--txt)}
  .ghost:hover{background:rgba(255,255,255,.1)}
  .ghost:disabled{opacity:.35;cursor:not-allowed}
  .icon-btn{background:rgba(255,255,255,.08);border-color:var(--line);padding:8px 12px;font-size:1rem}
  .icon-btn:hover{background:rgba(108,140,255,.3)}
  .icon-btn.big{font-size:1.4rem;padding:12px 18px;border-radius:999px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row.center{justify-content:center;margin-top:14px}

  /* ★ ปุ่ม auto toggle ในโหมดแฟลช */
  .auto-btn{
    font-family:inherit;cursor:pointer;border-radius:14px;font-size:.85rem;
    padding:12px 18px;border:1px solid rgba(34,211,166,.5);font-weight:700;
    background:rgba(34,211,166,.2);color:var(--accent2);transition:.15s
  }
  .auto-btn:hover{background:rgba(34,211,166,.32)}
  .auto-btn.off{
    background:rgba(255,255,255,.05);color:var(--muted);
    border-color:var(--line)
  }
  .auto-btn.off:hover{background:rgba(255,255,255,.1)}

  .game-top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .progress{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .progress .bar{height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
  .counter{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}

  .panel{
    margin-top:14px;padding:22px 18px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
    border:1px solid var(--line)
  }
  .prompt-label{font-size:.75rem;color:var(--muted);letter-spacing:.6px;margin-bottom:14px}
  .meaning{font-size:1.9rem;font-weight:800;line-height:1.3;margin-bottom:10px}
  .ipa{color:var(--accent2);font-size:1rem;letter-spacing:.3px;display:flex;
    justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
  .hint-th{color:var(--muted);font-size:.88rem;margin-top:8px}
  .example{
    margin:16px auto 0;max-width:480px;font-size:.95rem;color:#cfd6f5;
    background:rgba(0,0,0,.22);border:1px dashed var(--line);
    border-radius:14px;padding:12px 14px;line-height:1.6;font-style:italic
  }
  .example b{color:var(--accent2);font-style:normal}

  .answer-input{
    width:100%;max-width:420px;margin:18px auto 0;display:block;
    padding:14px 16px;border-radius:16px;font-size:1.15rem;text-align:center;
    background:rgba(0,0,0,.3);border:2px solid var(--line);color:var(--txt);
    font-family:inherit;outline:none;transition:.15s
  }
  .answer-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(108,140,255,.18)}
  .answer-input.ok{border-color:var(--accent2);background:rgba(34,211,166,.12)}
  .answer-input.bad{border-color:var(--danger);background:rgba(255,107,129,.12)}
  .answer-input::placeholder{color:rgba(148,160,200,.6);font-size:.95rem}

  .feedback{margin-top:14px;font-size:1rem;font-weight:600;min-height:26px;line-height:1.5}
  .feedback.ok{color:var(--accent2)}
  .feedback.bad{color:var(--danger)}
  .feedback .corr{color:var(--txt);background:rgba(255,255,255,.1);
    padding:2px 8px;border-radius:8px;margin-left:4px}

  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  @media(max-width:520px){.options{grid-template-columns:1fr}}
  .opt{
    font-family:inherit;cursor:pointer;padding:15px 14px;border-radius:16px;font-size:1rem;
    font-weight:600;color:var(--txt);border:2px solid var(--line);
    background:rgba(255,255,255,.05);transition:.15s
  }
  .opt:hover:not(:disabled){border-color:var(--accent);background:rgba(108,140,255,.16)}
  .opt:disabled{cursor:default}
  .opt.ok{border-color:var(--accent2);background:rgba(34,211,166,.22)}
  .opt.bad{border-color:var(--danger);background:rgba(255,107,129,.18);opacity:.85}

  .flip-wrap{perspective:1200px;margin:16px 0}
  .flip-card{
    position:relative;width:100%;height:320px;transform-style:preserve-3d;
    transition:transform .6s cubic-bezier(.4,.2,.2,1);cursor:pointer
  }
  .flip-card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:24px;border:1px solid var(--line);padding:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    text-align:center
  }
  .face.front{background:linear-gradient(160deg,rgba(108,140,255,.22),rgba(255,255,255,.03))}
  .face.back{transform:rotateY(180deg);
    background:linear-gradient(160deg,rgba(34,211,166,.2),rgba(255,255,255,.03))}
  .face .word{font-size:2.6rem;font-weight:800;letter-spacing:-.5px;word-break:break-word}
  .face .th{font-size:1.15rem;color:var(--warn);font-weight:700}
  .face .mean{font-size:1.5rem;font-weight:800}
  .face .tip{font-size:.75rem;color:var(--muted);margin-top:6px}
  .face .ex{font-size:.9rem;color:#cfd6f5;font-style:italic;line-height:1.6;max-width:400px}
  .face .ex b{color:var(--warn);font-style:normal}

  .result-card{
    text-align:center;padding:28px 18px;border-radius:24px;margin-top:12px;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
    border:1px solid var(--line)
  }
  .result-card .big{font-size:3rem;font-weight:900;
    background:linear-gradient(90deg,#8fa8ff,#22d3a6);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .result-card .lbl{color:var(--muted);font-size:.85rem;margin-top:4px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
  .metric{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:16px;padding:14px 8px}
  .metric .v{font-size:1.35rem;font-weight:800;color:var(--accent2)}
  .metric .k{font-size:.72rem;color:var(--muted);margin-top:2px}
  .missed{margin-top:18px;text-align:left}
  .missed h3{font-size:.9rem;color:var(--warn);margin-bottom:10px}
  .missed-item{
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.22);
    border:1px solid var(--line);margin-bottom:8px;font-size:.9rem
  }
  .missed-item .w{font-weight:700}
  .missed-item .i{color:var(--muted);font-size:.8rem}

  .post-actions{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px
  }
  @media(max-width:520px){.post-actions{grid-template-columns:1fr}}
  .post-btn{
    font-family:inherit;cursor:pointer;border-radius:18px;padding:18px 16px;
    display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;
    border:1px solid var(--line);color:var(--txt);transition:.18s;
    background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.03))
  }
  .post-btn:hover{transform:translateY(-3px)}
  .post-btn .p-emoji{font-size:1.7rem}
  .post-btn .p-title{font-weight:800;font-size:1rem}
  .post-btn .p-desc{font-size:.76rem;color:var(--muted);line-height:1.5}
  .post-btn.restart{
    background:linear-gradient(160deg,rgba(108,140,255,.25),rgba(255,255,255,.03));
    border-color:rgba(108,140,255,.5)
  }
  .post-btn.restart:hover{border-color:var(--accent)}
  .post-btn.review{
    background:linear-gradient(160deg,rgba(240,165,0,.25),rgba(255,255,255,.03));
    border-color:rgba(240,165,0,.5)
  }
  .post-btn.review:hover{border-color:var(--special)}

  .wtable{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:14px}
  .wtable th,.wtable td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  .wtable th{color:var(--muted);font-weight:600;font-size:.75rem;letter-spacing:.4px;position:sticky;top:0;background:#121830}
  .wtable td.en{font-weight:700;color:#aebcff}
  .wtable td.ipa{color:var(--accent2);font-size:.78rem;white-space:nowrap}
  .wtable td.ex{color:var(--muted);font-style:italic;font-size:.78rem}
  .table-wrap{max-height:70vh;overflow:auto;border-radius:14px;border:1px solid var(--line)}

  .foot{text-align:center;font-size:.72rem;color:rgba(148,160,200,.65);padding:10px 0 4px}
  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}
    50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">📚 WordQuest</div>
    <div class="header-right">
      <div class="stats" id="stats"></div>
      <button class="sound-toggle" id="soundToggle" title="เปิด/ปิดเสียง">🔊</button>
    </div>
  </header>
  <main id="screen"></main>
  <footer class="foot">ระบบจะออกเสียงคำใหม่ให้ฟังอัตโนมัติ • กดปุ่ม 🔊/🔇 เพื่อเปิด-ปิดเสียง</footer>
</div>

<script>
/* =========================================================
   1) ข้อมูลคำศัพท์ (180 คำ)
   ========================================================= */
const WORDS = [
  // ===== ชุดที่ 1: กิจวัตร & สถานที่ (1–20) =====
  {w:"always",   ipa:"/ˈɔːl.weɪz/",  th:"ออลเวย์ส",  m:"เสมอ",        ex:"He always helps."},
  {w:"often",    ipa:"/ˈɒf.ən/",     th:"ออฟเฟิน",   m:"บ่อย",         ex:"We often go early."},
  {w:"sometimes",ipa:"/ˈsʌm.taɪmz/", th:"ซัมไทม์ส",  m:"บางครั้ง",     ex:"Sometimes I rest."},
  {w:"never",    ipa:"/ˈnev.ər/",    th:"เนฟเวอร์",  m:"ไม่เคย",       ex:"He never forgets."},
  {w:"early",    ipa:"/ˈɜː.li/",     th:"เออรี",     m:"แต่เช้า",      ex:"She wakes early."},
  {w:"late",     ipa:"/leɪt/",       th:"เลท",       m:"สาย",          ex:"Do not be late."},
  {w:"prayer",   ipa:"/preər/",      th:"แพรร์",     m:"ละหมาด",       ex:"Prayer is important."},
  {w:"mosque",   ipa:"/mɒsk/",       th:"มอสก์",     m:"มัสยิด",       ex:"The mosque is quiet."},
  {w:"family",   ipa:"/ˈfæm.əl.i/",  th:"แฟมมะลี",   m:"ครอบครัว",     ex:"My family is kind."},
  {w:"neighbor", ipa:"/ˈneɪ.bər/",   th:"เนย์เบอร์", m:"เพื่อนบ้าน",   ex:"My neighbor needs help."},
  {w:"help",     ipa:"/help/",       th:"เฮลพ์",     m:"ช่วย",         ex:"Please help me."},
  {w:"honest",   ipa:"/ˈɒn.ɪst/",    th:"ออนนิสท์",  m:"ซื่อสัตย์",    ex:"He is honest."},
  {w:"kind",     ipa:"/kaɪnd/",      th:"ไคนด์",     m:"ใจดี",         ex:"She is kind."},
  {w:"patient",  ipa:"/ˈpeɪ.ʃənt/",  th:"เพย์เชินท์", m:"อดทน",        ex:"Be patient."},
  {w:"thank",    ipa:"/θæŋk/",       th:"แธงค์",     m:"ขอบคุณ",       ex:"I thank you."},
  {w:"promise",  ipa:"/ˈprɒm.ɪs/",   th:"พรอมิส",    m:"สัญญา",        ex:"Keep your promise."},
  {w:"remember", ipa:"/rɪˈmem.bər/", th:"รีเมมเบอร์", m:"จำ",          ex:"Remember this."},
  {w:"forget",   ipa:"/fəˈɡet/",     th:"ฟะเก็ท",    m:"ลืม",          ex:"Do not forget."},
  {w:"clean",    ipa:"/kliːn/",      th:"คลีน",      m:"สะอาด",        ex:"Keep it clean."},
  {w:"quiet",    ipa:"/ˈkwaɪ.ət/",   th:"ไควเอิท",   m:"เงียบ",        ex:"The room is quiet."},

  // ===== ชุดที่ 2: รองเท้า & การกระทำ (21–40) =====
  {w:"slipper",  ipa:"/ˈslɪp.ər/",   th:"สลิปเปอร์", m:"รองเท้าแตะ",   ex:"My slippers are old."},
  {w:"shoe",     ipa:"/ʃuː/",        th:"ชู",        m:"รองเท้า",      ex:"These shoes are new."},
  {w:"wear",     ipa:"/weər/",       th:"แวร์",      m:"สวมใส่",       ex:"He wears brown shoes."},
  {w:"put",      ipa:"/pʊt/",        th:"พุท",       m:"วาง/ใส่",      ex:"Put your shoes here."},
  {w:"take",     ipa:"/teɪk/",       th:"เทค",       m:"เอา/หยิบ",     ex:"Take your bag."},
  {w:"find",     ipa:"/faɪnd/",      th:"ไฟนด์",     m:"หา/พบ",        ex:"I cannot find my key."},
  {w:"lose",     ipa:"/luːz/",       th:"ลูส",       m:"ทำหาย",        ex:"Do not lose your money."},
  {w:"look",     ipa:"/lʊk/",        th:"ลุค",       m:"มอง/ดู",       ex:"Look at the door."},
  {w:"see",      ipa:"/siː/",        th:"ซี",        m:"เห็น",         ex:"I see a cat."},
  {w:"search",   ipa:"/sɜːtʃ/",      th:"เซิร์ช",    m:"ค้นหา",        ex:"We search everywhere."},

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const norm = s => s.toLowerCase().trim().replace(/\s+/g, ' ');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function blankEx(item){
  return item.ex.replace(new RegExp(escRe(item.w), 'gi'), '_____');
}
function hlEx(item){
  return item.ex.replace(new RegExp('(' + escRe(item.w) + ')', 'gi'), '<b>$1</b>');
}

function getLevelPool(level){ return WORDS.slice(level.poolStart, level.poolEnd); }
function getLevelWords(level){ return WORDS.slice(level.wordStart, level.wordEnd); }

/* ---- เสียงพูด ---- */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /en-US/i.test(v.lang) && /female|samantha|zira|google/i.test(v.name))
       || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text, rate = 0.85){
  if (!soundEnabled) return;
  if (!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---- เสียงเอฟเฟกต์ ---- */
let actx = null;
function beep(freq, dur, type = 'sine', vol = 0.12){
  if (!soundEnabled) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(vol, actx.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur + 0.03);
  }catch(e){}
}
const sfxOk   = () => { beep(660, .12); setTimeout(()=>beep(990, .16), 90); };
const sfxBad  = () => { beep(220, .2, 'sawtooth', .1); };
const sfxDone = () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18), i*110)); };

function autoSpeakWord(word, delay = 350){
  if (!soundEnabled) return;
  setTimeout(() => speak(word, 0.85), delay);
}

/* =========================================================
   ★★★ ระบบ Flash Auto (พลิก + เลื่อนอัตโนมัติ) ★★★
   ========================================================= */
let flashAutoTimer1 = null;  // 1) หน้า → หลัง
let flashAutoTimer2 = null;  // 2) หลัง → หน้า
let flashAutoTimer3 = null;  // 3) หน้า → เลื่อนอัตโนมัติ

let flashAutoEnabled = localStorage.getItem('wq_flash_auto') !== 'off';

/* ปรับเวลาได้ที่นี่ */
const FLASH_TIMING = {
  frontMs: 1000,   // แสดงด้านหน้าคำศัพท์ 1 วินาที
  backMs:  3500,   // แสดงด้านหลัง (ความหมาย) 3.5 วินาที
  gapMs:   800     // แสดงด้านหน้าอีกครั้งก่อนเลื่อน 0.8 วินาที
};

function clearFlashAuto(){
  if (flashAutoTimer1){ clearTimeout(flashAutoTimer1); flashAutoTimer1 = null; }
  if (flashAutoTimer2){ clearTimeout(flashAutoTimer2); flashAutoTimer2 = null; }
  if (flashAutoTimer3){ clearTimeout(flashAutoTimer3); flashAutoTimer3 = null; }
}

function startFlashAuto(cardEl){
  clearFlashAuto();
  if (!flashAutoEnabled) return;

  // 1) แสดงด้านหน้า 1 วินาที → พลิกไปด้านหลัง
  flashAutoTimer1 = setTimeout(() => {
    if (!document.body.contains(cardEl)) return;
    if (!flashAutoEnabled) return;
    cardEl.classList.add('flipped');

    // 2) แสดงด้านหลัง 3.5 วินาที → พลิกกลับมาด้านหน้า
    flashAutoTimer2 = setTimeout(() => {
      if (!document.body.contains(cardEl)) return;
      if (!flashAutoEnabled) return;
      cardEl.classList.remove('flipped');

      // 3) แสดงด้านหน้าสักครู่ → เลื่อนไปการ์ดถัดไปอัตโนมัติ
      flashAutoTimer3 = setTimeout(() => {
        if (!document.body.contains(cardEl)) return;
        if (!flashAutoEnabled) return;
        if (state.screen !== 'flash') return;

        if (state.index < state.queue.length - 1){
          state.index++;
          renderFlash(true);   // → เริ่มรอบ auto ใหม่ที่การ์ดถัดไป
        } else {
          renderFlashDone();   // จบชุด
        }
      }, FLASH_TIMING.gapMs);
    }, FLASH_TIMING.backMs);
  }, FLASH_TIMING.frontMs);
}

function toggleFlashAuto(){
  flashAutoEnabled = !flashAutoEnabled;
  localStorage.setItem('wq_flash_auto', flashAutoEnabled ? 'on' : 'off');

  const btn = document.getElementById('btnAutoToggle');
  const card = document.getElementById('flipCard');

  if (flashAutoEnabled){
    if (btn){ btn.classList.remove('off'); btn.textContent = '⏸ ปิดออโต้'; }
    if (card){
      card.classList.remove('flipped');
      startFlashAuto(card);
    }
  } else {
    if (btn){ btn.classList.add('off'); btn.textContent = '▶ เปิดออโต้'; }
    clearFlashAuto();
  }
}

function startFlash(){
  if (!currentLevel) return renderHome();
  state.mode = 'flash';
  state.queue = shuffle(getLevelWords(currentLevel));
  state.index = 0;
  renderFlash(true);
}

function renderFlash(autoSpeak = false){
  clearFlashAuto();   // ← ล้าง timer เก่าก่อนเสมอ
  state.screen = 'flash';
  state.answered = false;
  const item = state.queue[state.index];
  const pct = ((state.index + 1) / state.queue.length) * 100;

  screenEl.innerHTML = `
    <div class="game-top">
      <button class="ghost" id="btnBack">← ออก</button>
      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      <div class="counter">${state.index + 1}/${state.queue.length}</div>
    </div>

    <div class="flip-wrap fade">
      <div class="flip-card" id="flipCard">
        <div class="face front">
          <div class="word">${item.w}</div>
          <button class="icon-btn big" id="btnSpeak">🔊</button>

        </div>
        <div class="face back">
          <div class="ipa">${item.ipa}</div>
          <div class="th">${item.th}</div>
          <div class="mean">${item.m}</div>
          <div class="ex">${hlEx(item)}</div>
        </div>
      </div>
    </div>

    <div class="row center">
      <button class="ghost" id="btnPrev" ${state.index === 0 ? 'disabled' : ''}>← ก่อนหน้า</button>
      <button class="auto-btn ${flashAutoEnabled ? '' : 'off'}" id="btnAutoToggle">
        ${flashAutoEnabled ? '⏸ ปิดออโต้' : '▶ เปิดออโต้'}
      </button>
      <button class="primary" id="btnNext">ถัดไป →</button>
    </div>
  `;

  const card = document.getElementById('flipCard');

  // ★ ผู้เล่นกดการ์ดเอง → หยุด auto cycle (ผู้เล่นควบคุมเอง)
  card.onclick = () => {
    clearFlashAuto();
    card.classList.toggle('flipped');
  };

  document.getElementById('btnSpeak').onclick = e => {
    e.stopPropagation();
    speak(item.w, 0.8);
  };

  document.getElementById('btnPrev').onclick = () => {
    clearFlashAuto();
    if (state.index > 0){
      state.index--;
      renderFlash(true);

  state.queue = shuffle(items).slice(0, currentLevel.questionsPerRound);
  state.index = 0;
  state.score = 0; state.correct = 0; state.wrong = 0;
  state.streak = 0; state.bestStreak = 0; state.missed = [];
  nextQuestion();
}

  if (state.index >= state.queue.length){ renderResult(); return; }
  state.answered = false;
  if (state.mode === 'spell')       renderSpell();
  else if (state.mode === 'choice') renderChoice();

  autoSpeakWord(item.w, 350);

  let hintUsed = false;
  btnHint.onclick = () => {
    if (state.answered) return;
    hintUsed = true;
    const cur = norm(input.value);
    fb.className = 'feedback';
    fb.innerHTML = `<span style="color:var(--warn)">คำอ่าน: ${item.th}</span>`;
    if (item.w.startsWith(cur) && cur.length < item.w.length){
      input.value = item.w.slice(0, cur.length + 1);
    }
    input.focus();
  };

  btnCheck.onclick = () => {
    if (!state.answered){
      const val = norm(input.value);
      if (!val){ input.focus(); input.classList.add('shake');
        setTimeout(()=>input.classList.remove('shake'), 420); return; }

      state.answered = true;
      const ok = (val === norm(item.w));

      if (ok){
        state.correct++; state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        state.score += 10 + (hintUsed ? 0 : 5) + state.streak * 2;
        input.classList.add('ok');
        fb.className = 'feedback ok';
        fb.innerHTML = `ถูกต้อง! 🎉 <span class="corr">${item.w}</span> ${item.ipa}`;
        sfxOk();
      } else {
        state.wrong++; state.streak = 0;
        state.missed.push(item);
        input.classList.add('bad');
        fb.className = 'feedback bad';
        fb.innerHTML = `ยังไม่ถูก — คำตอบคือ <span class="corr">${item.w}</span> ${item.ipa}`;
        sfxBad();
        speak(item.w, 0.75);
      }
      input.disabled = true;
      btnHint.disabled = true;
      btnCheck.textContent = 'ถัดไป →';
      updateStats();
    } else {
      state.index++; nextQuestion();
    }
  };
  bindBack();
}

/* ---------- 7.2 เลือกคำตอบ ---------- */
function renderChoice(){
  state.screen = 'choice';
  const item = state.queue[state.index];
  const pool = getLevelPool(currentLevel);
  const wrongPool = shuffle(pool.filter(x => x.w !== item.w)).slice(0, 3);
  const opts = shuffle([item, ...wrongPool]);
  updateStats();

  screenEl.innerHTML = `
    ${topBar()}
    <div class="panel fade">
      <div class="prompt-label">คำใดแปลว่า</div>
      <div class="meaning">${item.m}</div>
      <div class="ipa">${item.ipa}
        <button class="icon-btn" id="btnSpeak">🔊</button>
      </div>
      <div class="options" id="options">
        ${opts.map(o => `<button class="opt" data-w="${o.w}">${o.w}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;

  document.getElementById('btnSpeak').onclick = () => speak(item.w, 0.8);
  autoSpeakWord(item.w, 400);

  const fb = document.getElementById('feedback');
  const btns = [...document.querySelectorAll('.opt')];

  btns.forEach(b => {
    b.onclick = () => {
      if (state.answered) return;
      state.answered = true;
      const ok = b.dataset.w === item.w;

      btns.forEach(x => {
        x.disabled = true;
        if (x.dataset.w === item.w) x.classList.add('ok');
      });

      if (ok){
        state.correct++; state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        state.score += 10 + state.streak * 2;
        fb.className = 'feedback ok';
        fb.textContent = 'ถูกต้อง! 🎉';
        sfxOk();
      } else {
        b.classList.add('bad');
        state.wrong++; state.streak = 0;
        state.missed.push(item);
        fb.className = 'feedback bad';
        fb.innerHTML = `ผิด — คำตอบที่ถูกคือ <span class="corr">${item.w}</span> ${item.ipa}`;
        sfxBad();
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'primary';
      nextBtn.style.marginTop = '16px';
      nextBtn.textContent = 'ถัดไป →';
      nextBtn.onclick = () => { state.index++; nextQuestion(); };
      fb.appendChild(document.createElement('br'));
      fb.appendChild(nextBtn);
      updateStats();
    };
  });
  bindBack();
}

/* ---------- 7.3 ฟังเสียง ---------- */
function renderListen(){
  state.screen = 'listen';
  const item = state.queue[state.index];
  updateStats();

  screenEl.innerHTML = `
    ${topBar()}
    <div class="panel fade">
      <div class="prompt-label">ฟังเสียงแล้วพิมพ์คำที่ได้ยิน</div>
      <button class="icon-btn big" id="btnPlay" style="margin:10px auto 4px">🔊</button>
      <div class="hint-th">แตะเพื่อฟังอีกครั้ง</div>
      <input id="answer" class="answer-input" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             placeholder="พิมพ์คำที่ได้ยิน...">
      <div class="feedback" id="feedback"></div>
      <div class="row center">
        <button class="ghost" id="btnSlow">🐢 ฟังช้า ๆ</button>
        <button class="ghost" id="btnHint">💡 ใบ้</button>
        <button class="primary" id="btnCheck">ตรวจสอบ</button>
      </div>
    </div>
  `;

  const input = document.getElementById('answer');
  const fb = document.getElementById('feedback');
  const btnCheck = document.getElementById('btnCheck');
  const btnHint = document.getElementById('btnHint');
  let hintUsed = false;

  const play = (rate) => speak(item.w, rate);
  document.getElementById('btnPlay').onclick = () => play(0.85);
  document.getElementById('btnSlow').onclick = () => play(0.5);

  autoSpeakWord(item.w, 350);
  input.focus();

  btnHint.onclick = () => {
    if (state.answered) return;
    hintUsed = true;
    fb.className = 'feedback';
    fb.innerHTML = `<span style="color:var(--warn)">คำอ่าน: ${item.th} • ขึ้นต้นด้วย "${item.w[0]}" • ${item.w.length} ตัวอักษร</span>`;
    input.focus();
  };

  btnCheck.onclick = () => {
    if (!state.answered){
      const val = norm(input.value);
      if (!val){ input.focus(); input.classList.add('shake');
        setTimeout(()=>input.classList.remove('shake'), 420); return; }

      state.answered = true;
      const ok = (val === norm(item.w));

      if (ok){
        state.correct++; state.streak++;
        state.bestStreak = Math.max(state.bestStreak, state.streak);
        state.score += 10 + (hintUsed ? 0 : 5) + state.streak * 2;
        input.classList.add('ok');
        fb.className = 'feedback ok';
        fb.innerHTML = `ถูกต้อง! 🎉 <span class="corr">${item.w}</span> ${item.ipa}`;
        sfxOk();
      } else {
        state.wrong++; state.streak = 0;
        state.missed.push(item);
        input.classList.add('bad');
        fb.className = 'feedback bad';
        fb.innerHTML = `ยังไม่ถูก — คำตอบคือ <span class="corr">${item.w}</span> ${item.ipa}`;
        sfxBad();
      }
      input.disabled = true;
      btnHint.disabled = true;
      btnCheck.textContent = 'ถัดไป →';
      speak(item.w, 0.7);
      updateStats();
    } else {
      state.index++; nextQuestion();
    }
  };
  bindBack();
}

/* =========================================================
   8) สรุปผล
   ========================================================= */
function renderResult(){
  clearFlashAuto();
  state.screen = 'result';
  const total = state.correct + state.wrong;
  const acc = total ? Math.round((state.correct / total) * 100) : 0;

  const best = Number(localStorage.getItem('wq_best') || 0);
  const isNewBest = state.score > best;
  if (isNewBest) localStorage.setItem('wq_best', String(state.score));

  const emoji = acc >= 90 ? '🏆' : acc >= 70 ? '🎉' : acc >= 50 ? '💪' : '📖';
  const title = acc >= 90 ? 'ยอดเยี่ยม!' : acc >= 70 ? 'ดีมาก!' : acc >= 50 ? 'สู้ต่อไป!' : 'ทบทวนอีกนิดนะ';

  const hasMissed = state.missed.length > 0;
  const missedHTML = hasMissed
    ? `<div class="missed">
         <h3>📌 คำที่ควรทบทวน (${state.missed.length})</h3>
         ${state.missed.map(x => `
           <div class="missed-item">
             <span class="w">${x.w}</span>
             <span class="i">${x.ipa} • ${x.th} • ${x.m}</span>
           </div>`).join('')}
       </div>`
    : `<p class="sub" style="margin-top:16px;color:var(--accent2)">✨ ไม่มีคำที่ตอบผิดเลย!</p>`;

  screenEl.innerHTML = `
    <div class="result-card fade">
      <div style="font-size:2.8rem">${emoji}</div>
      <div class="big">${state.score}</div>
      <div class="lbl">${title}${isNewBest ? ' • สถิติใหม่! 🏅' : ''}</div>

      <div class="metrics">
        <div class="metric"><div class="v">${state.correct}/${total}</div><div class="k">ตอบถูก</div></div>
        <div class="metric"><div class="v">${acc}%</div><div class="k">ความแม่นยำ</div></div>
        <div class="metric"><div class="v">🔥${state.bestStreak}</div><div class="k">สตรีคสูงสุด</div></div>
      </div>

      ${missedHTML}

      <div class="post-actions">
        <button class="post-btn restart" id="btnRestart" ${!hasMissed ? 'style="grid-column:1 / -1"' : ''}>
          <span class="p-emoji">🔁</span>
          <span class="p-title">เริ่มใหม่</span>
          <span class="p-desc">เล่นรอบใหม่แบบสุ่มปกติ</span>
        </button>
        ${hasMissed ? `
          <button class="post-btn review" id="btnReview">
            <span class="p-emoji">📝</span>
            <span class="p-title">แก้ไขคำที่ผิด</span>
            <span class="p-desc">เล่นเฉพาะ ${state.missed.length} คำที่ทำผิดในรอบนี้</span>
          </button>
        ` : ''}
      </div>

      <div class="row center">
        <button class="ghost" id="btnMenu">📚 เลือกโหมดอื่น</button>
        <button class="ghost" id="btnHome">🏠 หน้าหลัก</button>
      </div>
    </div>
  `;

  sfxDone();
  updateStats();
  document.getElementById('btnRestart').onclick = () => startQuiz(state.mode);
  document.getElementById('btnMenu').onclick = renderModeSelect;
  document.getElementById('btnHome').onclick = renderHome;

  if (hasMissed){
    document.getElementById('btnReview').onclick = () => {
      state.queue = shuffle(state.missed.slice());
      state.index = 0;
      state.score = 0; state.correct = 0; state.wrong = 0;
      state.streak = 0; state.bestStreak = 0; state.missed = [];
      nextQuestion();
    };
  }
}

/* =========================================================
   9) คีย์บอร์ด + เริ่มต้น
   ========================================================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (state.screen === 'spell' || state.screen === 'listen'){
    const btn = document.getElementById('btnCheck');
    if (btn){ e.preventDefault(); btn.click(); }
  }
});

renderHome();
</script>
